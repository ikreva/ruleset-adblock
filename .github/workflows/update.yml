name: update-rules

on:
  schedule:
    - cron: "0 21 * * *"        # 每日 UTC 21:00 = 北京时间 05:00
  workflow_dispatch: {}

permissions:
  contents: write               # 允许 GITHUB_TOKEN 提交 dist/ 与 upstream/

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # 内核版本锚定：与本地验证（README 记录）保持一致，保证产物可复现；
      # 升级只需改这里，并同步 README 的"构建与本地验证"一节
      - name: Install sing-box
        run: |
          gh release download v1.14.4 --repo SagerNet/sing-box \
            --pattern "sing-box-1.14.4-linux-amd64.tar.gz" --output sb.tgz
          tar xzf sb.tgz
          sudo mv sing-box-1.14.4-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Install mihomo
        run: |
          gh release download v1.19.34 --repo MetaCubeX/mihomo \
            --pattern "mihomo-linux-amd64-compatible-v1.19.34.gz" --output mh.gz
          ls -la mh.gz; file mh.gz
          gunzip -v mh.gz && chmod +x mihomo-linux-amd64-compatible-v1.19.34
          sudo mv mihomo-linux-amd64-compatible-v1.19.34 /usr/local/bin/mihomo
          mihomo -v

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # fetch.mjs：下载 + 输入校验（ABP 头/行数下限）+ 主备双链重试
      # + 新鲜度告警（行数骤降 <95% → ::warning；主备均失败且无本地缓存 → exit 1 红灯）
      - name: Fetch upstream (HaGeZi, best-effort)
        run: bun scripts/fetch.mjs

      # build.mjs：解析 → 准入剔除（sources/allow.list）→ 去重排序
      # → 产 json source / clash list → sing-box compile srs → mihomo convert-ruleset mrs
      - name: Build dist
        run: bun scripts/build.mjs

      # assert.mjs：任一步失败即终止 → Commit 步骤不执行 → 失败不发布
      - name: Validate (decompile readback + probe assertions)
        run: bun scripts/assert.mjs

      - name: Commit dist and upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist upstream
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "chore: 更新 HaGeZi pro 产物（$(date -u +%F)）"
            git push
          fi
